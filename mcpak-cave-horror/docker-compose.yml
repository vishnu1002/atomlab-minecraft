# itzg/minecraft-server docs: https://github.com/itzg/docker-minecraft-server/tree/master/docs
# Pack: Cave Horror Project 1 (KRCZSt8F), Forge 1.20.1, pinned v3.6
# Note: Simple Voice Chat (UDP 24454) not tunneled via playit TCP setup
services:
  mc3:
    image: itzg/minecraft-server:java17
    container_name: mc3
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      MEMORY: "10G"
      TYPE: "MODRINTH"
      MODRINTH_MODPACK: "https://modrinth.com/modpack/cave-horror-project-modpack/version/v3.6"
      VERSION: "1.20.1"
      ONLINE_MODE: "FALSE"
      MOTD: "Cave Horror"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    expose: ["25565"]
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "localhost"]
      interval: 45s
      timeout: 15s
      retries: 4
    networks:
      mc_network:
        ipv4_address: 172.30.0.7

  playit-mc3:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    container_name: playit-mc3
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      TZ: "UTC"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mc3:
        condition: service_healthy
    network_mode: "service:mc3"

networks:
  mc_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
