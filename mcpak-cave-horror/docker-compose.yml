# itzg/minecraft-server docs: https://github.com/itzg/docker-minecraft-server/tree/master/docs
# Mirror (rendered): https://docker-minecraft-server.readthedocs.io/en/latest/
# Modpack: Cave Horror Project 1 – horror survival, 200+ FTB quests.
#   Modrinth page: https://modrinth.com/modpack/cave-horror-project-modpack
#   Permanent link (id KRCZSt8F): https://modrinth.com/project/KRCZSt8F
# Pinned version: v3.6 | Loader: Forge | MC: 1.20.1 (image java17) | MEMORY=10G
# Note: Simple Voice Chat (UDP 24454) not tunneled via playit TCP setup
services:
  mc3:
    image: itzg/minecraft-server:java17
    container_name: mc3
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      MEMORY: "10G"
      TYPE: "MODRINTH"
      MODRINTH_MODPACK: "https://modrinth.com/modpack/cave-horror-project-modpack/version/v3.6"
      VERSION: "1.20.1"
      ONLINE_MODE: "FALSE"
      MOTD: "Cave Horror"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    expose: ["25565"]
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "127.0.0.1"]
      interval: 45s
      timeout: 15s
      retries: 4

  playit-mc3:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    container_name: playit-mc3
    restart: unless-stopped
    env_file:
      - ../.env # shared repo-root playit key (SECRET_KEY)
    environment:
      TZ: "UTC"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mc3:
        condition: service_healthy
    network_mode: "service:mc3"
