# itzg/minecraft-server docs: https://github.com/itzg/docker-minecraft-server/tree/master/docs
# Pack: Prominence II Hasturian Era (EGs3lC8D), Fabric 1.20.1, pinned v4.1.0
services:
  mc4:
    image: itzg/minecraft-server:java17
    container_name: mc4
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      MEMORY: "10G"
      TYPE: "MODRINTH"
      MODRINTH_MODPACK: "https://modrinth.com/modpack/prominence-2-fabric/version/v4.1.0"
      VERSION: "1.20.1"
      ONLINE_MODE: "FALSE"
      MOTD: "Prominence 2"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    expose: ["25565"]
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "localhost"]
      interval: 45s
      timeout: 15s
      retries: 4
    networks:
      mc_network:
        ipv4_address: 172.30.0.8

  playit-mc4:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    container_name: playit-mc4
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      TZ: "UTC"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mc4:
        condition: service_healthy
    network_mode: "service:mc4"

networks:
  mc_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
