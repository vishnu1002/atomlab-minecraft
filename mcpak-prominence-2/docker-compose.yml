# itzg/minecraft-server docs: https://github.com/itzg/docker-minecraft-server/tree/master/docs
# Mirror (rendered): https://docker-minecraft-server.readthedocs.io/en/latest/
# Modpack: Prominence II – Hasturian Era – lore-rich RPG (talent tree, artifacts, bosses).
#   Modrinth page: https://modrinth.com/modpack/prominence-2-fabric
#   Permanent link (id EGs3lC8D): https://modrinth.com/project/EGs3lC8D
# Pinned version: v4.1.0 | Loader: Fabric | MC: 1.20.1 (image java17) | MEMORY=10G
services:
  mc4:
    image: itzg/minecraft-server:java17
    container_name: mc4
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      MEMORY: "10G"
      TYPE: "MODRINTH"
      MODRINTH_MODPACK: "https://modrinth.com/modpack/prominence-2-fabric/version/v4.1.0"
      VERSION: "1.20.1"
      ONLINE_MODE: "FALSE"
      MOTD: "Prominence 2"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    expose: ["25565"]
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "127.0.0.1"]
      interval: 45s
      timeout: 15s
      retries: 4

  playit-mc4:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    container_name: playit-mc4
    restart: unless-stopped
    env_file:
      - ../.env # shared repo-root playit key (SECRET_KEY)
    environment:
      TZ: "UTC"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mc4:
        condition: service_healthy
    network_mode: "service:mc4"
