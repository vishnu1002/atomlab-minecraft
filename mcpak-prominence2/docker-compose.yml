# itzg/minecraft-server docs: https://github.com/itzg/docker-minecraft-server/tree/master/docs
# Mirror (rendered): https://docker-minecraft-server.readthedocs.io/en/latest/
# Modpack: Prominence II – Hasturian Era – lore-rich RPG (talent tree, artifacts, bosses).
#   CurseForge: https://www.curseforge.com/minecraft/modpacks/prominence-2-hasturian-era (id 466901, slug prominence-2-hasturian-era)
#   Modrinth (alt): https://modrinth.com/modpack/prominence-2-fabric (id EGs3lC8D)
# Pinned version: CF v4.1.1 (file 8960572) | Loader: Fabric | MC: 1.20.1 (image java17) | MEMORY=10G
services:
  mcpak2:
    image: itzg/minecraft-server:java17
    container_name: mcpak2
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      MEMORY: "10G"
      TYPE: "AUTO_CURSEFORGE"
      CF_SLUG: "prominence-2-hasturian-era"
      CF_FILE_ID: "8960572"
      CF_FORCE_INCLUDE_MODS: "simply-tooltips,1475755"
      CF_FORCE_SYNCHRONIZE: "true"
      VERSION: "1.20.1"
      ONLINE_MODE: "FALSE"
      MOTD: "Prominence 2"
    volumes:
      - ./data:/data
      - /etc/localtime:/etc/localtime:ro
    expose: ["25565"]
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "127.0.0.1"]
      interval: 45s
      timeout: 15s
      retries: 4
      start_period: 12m # modpack takes ~10m to load; don't mark unhealthy during startup

  # NB: always run bare `docker compose up -d` so both services start.
  # `up -d mcpak2` leaves playit-mcpak2 in Created (compose only starts named services).
  playit-mcpak2:
    image: ghcr.io/playit-cloud/playit-agent:0.17
    container_name: playit-mcpak2
    restart: unless-stopped
    env_file:
      - ../.env # shared repo-root playit key (SECRET_KEY)
    environment:
      TZ: "UTC"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mcpak2:
        condition: service_healthy
    network_mode: "service:mcpak2"
